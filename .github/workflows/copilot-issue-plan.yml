name: Copilot issue plan

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero della GitHub issue"
        required: true
        default: "1"

permissions:
  contents: read
  issues: read
  copilot-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Load authorized issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,url,labels \
            > "$RUNNER_TEMP/issue.json"

          jq -e '.labels | any(.name == "ready-for-ai")' \
            "$RUNNER_TEMP/issue.json"

          {
            echo "Analizza la seguente GitHub issue."
            echo "Non modificare file e non eseguire comandi."
            echo "Produci soltanto un piano di implementazione conciso."
            echo
            echo "Titolo:"
            jq -r '.title' "$RUNNER_TEMP/issue.json"
            echo
            echo "Descrizione:"
            jq -r '.body' "$RUNNER_TEMP/issue.json"
          } > "$RUNNER_TEMP/copilot-prompt.txt"

      - name: Generate implementation plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -s --no-ask-user \
            < "$RUNNER_TEMP/copilot-prompt.txt" \
            > "$RUNNER_TEMP/copilot-plan.md"

          {
            echo "## Copilot implementation plan"
            echo
            cat "$RUNNER_TEMP/copilot-plan.md"
          } >> "$GITHUB_STEP_SUMMARY"
