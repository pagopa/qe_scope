name: Copilot implement issue

run-name: Copilot implement issue #${{ github.event.issue.number || inputs.issue_number }}

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero della GitHub issue"
        required: true
        default: "3"

concurrency:
  group: copilot-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'ready-for-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: read
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm install -g @github/copilot
          python -m pip install -e ".[dev]"

      - name: Load authorized issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,labels \
            > "$RUNNER_TEMP/issue.json"

          jq -e \
            '.labels | any(.name | ascii_downcase == "ready-for-ai")' \
            "$RUNNER_TEMP/issue.json"

          {
            echo "Implementa la GitHub issue riportata di seguito."
            echo "Puoi creare o modificare esclusivamente:"
            echo ".github/copilot-instructions.md"
            echo
            echo "Non modificare nessun altro file."
            echo "CLAUDE.md è intenzionalmente locale e non versionato."
            echo "Usa README.md e ARCHITECTURE.md come fonti."
            echo
            echo "Titolo:"
            jq -r '.title' "$RUNNER_TEMP/issue.json"
            echo
            echo "Descrizione:"
            jq -r '.body' "$RUNNER_TEMP/issue.json"
          } > "$RUNNER_TEMP/copilot-prompt.txt"

      - name: Generate change with Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            --silent \
            --no-ask-user \
            --allow-tool='write(.github/copilot-instructions.md)' \
            < "$RUNNER_TEMP/copilot-prompt.txt" \
            | tee "$RUNNER_TEMP/copilot-output.txt"

      - name: Validate changed files
        run: |
          test -f .github/copilot-instructions.md

          git add -A
          CHANGED_FILES="$(git diff --cached --name-only)"

          if [ "$CHANGED_FILES" != ".github/copilot-instructions.md" ]; then
            echo "Copilot ha modificato file non autorizzati:"
            echo "$CHANGED_FILES"
            exit 1
          fi

      - name: Run quality checks
        run: |
          pytest
          ruff check src/ tests/

      - name: Create patch
        run: git diff --cached --binary > copilot.patch

      - name: Upload validated patch
        uses: actions/upload-artifact@v4
        with:
          name: copilot-change
          path: copilot.patch
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: copilot-change
          path: ${{ runner.temp }}/copilot-change

      - name: Create branch, commit and Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          BRANCH_NAME="copilot/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

          git switch -c "$BRANCH_NAME"
          git apply --index "$RUNNER_TEMP/copilot-change/copilot.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "docs: add Copilot repository instructions"
          git push --set-upstream origin "$BRANCH_NAME"

          ISSUE_TITLE="$(
            gh issue view "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json title \
              --jq '.title'
          )"

          {
            echo "Relates to #${ISSUE_NUMBER}"
            echo
            echo "Modifica generata da GitHub Copilot CLI."
            echo
            echo "Controlli eseguiti:"
            echo "- pytest"
            echo "- ruff check src/ tests/"
            echo
            echo "La Pull Request resta Draft e richiede revisione umana."
          } > "$RUNNER_TEMP/pr-body.md"

          PR_URL="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH_NAME" \
              --draft \
              --title "$ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          )"

          HEAD_SHA="$(git rev-parse HEAD)"
          STATUS_CONTEXT="SCOPE CI / bot PR"

          set_ci_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"

            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$state" \
              -f context="$STATUS_CONTEXT" \
              -f description="$description" \
              -f target_url="$target_url" \
              > /dev/null
          }

          # workflow_dispatch esegue la CI sul commit corretto, ma GitHub non
          # mostra i suoi job nel riquadro Checks della PR. Questo commit status
          # rende visibile l'esito e rimanda all'esecuzione auditabile completa.
          set_ci_status pending "Avvio della CI ordinaria" "$PR_URL"

          if ! gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH_NAME"; then
            set_ci_status failure "Impossibile avviare la CI ordinaria" "$PR_URL"
            exit 1
          fi

          CI_RUN_ID=""
          for attempt in $(seq 1 20); do
            CI_RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --branch "$BRANCH_NAME" \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"

            if [ -n "$CI_RUN_ID" ]; then
              break
            fi

            sleep 3
          done

          if [ -z "$CI_RUN_ID" ]; then
            set_ci_status failure "Esecuzione CI non trovata" "$PR_URL"
            exit 1
          fi

          CI_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          set_ci_status pending "CI ordinaria in esecuzione" "$CI_URL"

          if gh run watch "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 5; then
            set_ci_status success "CI ordinaria completata" "$CI_URL"
          else
            set_ci_status failure "CI ordinaria non superata" "$CI_URL"
            exit 1
          fi

          {
            echo "## Draft Pull Request creata"
            echo
            echo "$PR_URL"
            echo
            echo "SCOPE CI completata e pubblicata sulla PR: $CI_URL"
          } >> "$GITHUB_STEP_SUMMARY"
