name: Notify Jira when Copilot PR is merged

on:
  pull_request:
    types: [closed]

jobs:
  notify-jira:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Notify Jira
        env:
          JIRA_WEBHOOK_URL: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_URL }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_SECRET }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$JIRA_WEBHOOK_URL"
          test -n "$JIRA_WEBHOOK_SECRET"

          JIRA_KEY="$(
            printf '%s\n' "$PR_TITLE" |
              sed -nE 's/^\[([A-Z][A-Z0-9_]*-[0-9]+)\].*/\1/p'
          )"

          if [ -z "$JIRA_KEY" ]; then
            echo "La Jira key non è presente nel titolo della PR."
            exit 1
          fi

          PAYLOAD="$(
            jq -n \
              --arg jiraKey "$JIRA_KEY" \
              --arg event "pr_merged" \
              --arg prUrl "$PR_URL" \
              --arg mergedBy "$MERGED_BY" \
              --arg mergeCommitSha "$MERGE_COMMIT_SHA" \
              '{
                jiraKey: $jiraKey,
                event: $event,
                prUrl: $prUrl,
                mergedBy: $mergedBy,
                mergeCommitSha: $mergeCommitSha
              }'
          )"

          curl \
            --request POST \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Content-Type: application/json" \
            --header "X-Automation-Webhook-Token: $JIRA_WEBHOOK_SECRET" \
            --data "$PAYLOAD" \
            "$JIRA_WEBHOOK_URL"

          {
            echo "## Jira notificato"
            echo
            echo "- Jira: $JIRA_KEY"
            echo "- PR: $PR_URL"
            echo "- Merge eseguito da: $MERGED_BY"
            echo "- Evento: pr_merged"
          } >> "$GITHUB_STEP_SUMMARY"
