name: SCOPE CI

# Lint + golden test ad ogni push/PR. Le guardie --strict sull'inventario e
# sulla copertura reale (ci-check.sh) richiedono il repo target pn-b2b-client
# e NON girano qui: vanno agganciate a uno scheduler che ha accesso al repo
# (SCOPE non fa operazioni remote). Qui si verifica il TOOL, non i dati.

on:
  push:
    branches: ["**"]
  pull_request:
  # Le PR create con GITHUB_TOKEN non avviano normalmente questa CI.
  # Il bot la richiama sul branch e pubblica sulla PR uno stato con il suo esito.
  workflow_dispatch:

# Permessi minimi per il GITHUB_TOKEN: la matrice legge il codice; il job finale
# pubblica un unico commit status, usato dal ruleset sia per le PR umane sia per
# quelle create dal bot.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Golden test (pytest)
        run: pytest

  required-status:
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish required CI status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TEST_RESULT" = "success" ]; then
            STATE="success"
            DESCRIPTION="CI ordinaria completata"
          else
            STATE="failure"
            DESCRIPTION="CI ordinaria non superata"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$STATE" \
            -f context="SCOPE CI / required" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL" \
            > /dev/null

          test "$STATE" = "success"
